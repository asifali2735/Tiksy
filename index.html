<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tiksy - Lifestyle & Short Videos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #222222;
        }

        /* Main App Container */
        .app-container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* Status Bar */
        .status-bar {
            padding: 12px 16px 8px;
            background: white;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 0.5px solid #f0f0f0;
        }

        /* Header */
        .header {
            padding: 8px 16px;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 0.5px solid #f0f0f0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header-icons {
            display: flex;
            gap: 20px;
        }

        .header-icons svg {
            width: 22px;
            height: 22px;
            stroke: #222;
            stroke-width: 1.5;
        }

        /* Search Bar */
        .search-bar {
            padding: 12px 16px;
            background: white;
        }

        .search-input {
            background: #f5f5f5;
            border-radius: 12px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #999;
            font-size: 14px;
        }

        .search-input svg {
            width: 18px;
            height: 18px;
            stroke: #999;
        }

        /* Category Tabs */
        .categories {
            padding: 8px 16px;
            display: flex;
            gap: 24px;
            overflow-x: auto;
            border-bottom: 0.5px solid #f0f0f0;
            background: white;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .category {
            font-size: 14px;
            font-weight: 500;
            color: #666;
            padding-bottom: 8px;
            white-space: nowrap;
            cursor: pointer;
        }

        .category.active {
            color: #ff6b6b;
            border-bottom: 2px solid #ff6b6b;
        }

        /* Main Content - 2 Column Grid */
        .feed-container {
            padding: 12px 12px 80px;
            background: #f8f8f8;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Post Card */
        .post-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .post-card:hover {
            transform: translateY(-2px);
        }

        .image-container {
            position: relative;
            aspect-ratio: 4 / 5;
            overflow: hidden;
        }

        .post-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            gap: 4px;
            color: white;
            font-size: 11px;
        }

        .multi-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.6);
            border-radius: 20px;
            padding: 4px 8px;
            color: white;
            font-size: 11px;
        }

        .post-info {
            padding: 10px;
        }

        .title {
            font-size: 13px;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .user-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
        }

        .user-avatar {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            object-fit: cover;
        }

        .username {
            font-size: 11px;
            color: #666;
        }

        .stats {
            display: flex;
            gap: 12px;
            font-size: 11px;
            color: #999;
        }

        .stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Full Screen Video Modal (TikTok-style) */
        .fullscreen-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: black;
            z-index: 1000;
            display: none;
            flex-direction: column;
        }

        .fullscreen-modal.active {
            display: flex;
        }

        .video-container-scroll {
            flex: 1;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }

        .video-slide {
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            background: black;
        }

        .video-slide video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
            color: white;
        }

        .close-modal {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 1001;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-size: 20px;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255,255,255,0.96);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 10px 16px 24px;
            border-top: 0.5px solid #f0f0f0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke: #666;
            stroke-width: 1.5;
            fill: none;
        }

        .nav-item.active svg {
            stroke: #ff6b6b;
            fill: #ff6b6b;
        }

        .nav-item.active .nav-label {
            color: #ff6b6b;
        }

        .nav-label {
            font-size: 10px;
            color: #666;
        }

        /* Create Post Button */
        .create-btn {
            position: fixed;
            bottom: 80px;
            right: 16px;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(255,107,107,0.4);
            cursor: pointer;
            z-index: 101;
            transition: transform 0.2s;
        }

        .create-btn:hover {
            transform: scale(1.05);
        }

        .create-btn svg {
            width: 26px;
            height: 26px;
            stroke: white;
            stroke-width: 2;
        }

        .like-animation {
            position: fixed;
            font-size: 48px;
            pointer-events: none;
            animation: likeFloat 0.6s ease-out forwards;
            z-index: 2000;
        }

        @keyframes likeFloat {
            0% {
                opacity: 1;
                transform: scale(0.5);
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translateY(-50px) scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Status Bar -->
        <div class="status-bar">
            <span>9:41</span>
            <span>📶 🔋 100%</span>
        </div>

        <!-- Header -->
        <div class="header">
            <div class="logo">Tiksy</div>
            <div class="header-icons">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-bar">
            <div class="search-input">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <span>Search Tiksy...</span>
            </div>
        </div>

        <!-- Categories -->
        <div class="categories">
            <div class="category active">For You</div>
            <div class="category">Following</div>
            <div class="category">Fashion</div>
            <div class="category">Food</div>
            <div class="category">Travel</div>
            <div class="category">Beauty</div>
            <div class="category">Living</div>
        </div>

        <!-- Main Feed - 2 Column Grid -->
        <div class="feed-container">
            <div class="grid" id="feedGrid"></div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-item active" data-nav="home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2h-5v-8H7v8H5a2 2 0 0 1-2-2z"/>
                </svg>
                <span class="nav-label">Home</span>
            </div>
            <div class="nav-item" data-nav="explore">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="12" cy="12" r="10"/>
                    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
                </svg>
                <span class="nav-label">Explore</span>
            </div>
            <div class="nav-item" data-nav="notifications">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <span class="nav-label">Alerts</span>
            </div>
            <div class="nav-item" data-nav="profile">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span class="nav-label">Profile</span>
            </div>
        </div>

        <!-- Create Post Button -->
        <div class="create-btn" id="createBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
        </div>

        <!-- Fullscreen Video Modal -->
        <div class="fullscreen-modal" id="videoModal">
            <div class="close-modal" id="closeModal">✕</div>
            <div class="video-container-scroll" id="videoScrollContainer"></div>
        </div>
    </div>

    <script>
        // Tiksy - Sample Post Data
        const posts = [
            {
                id: 1,
                type: 'image',
                images: ['https://picsum.photos/id/20/400/500', 'https://picsum.photos/id/21/400/500'],
                title: '🌸 Spring fashion must-haves! These pastels are everything 💕',
                username: 'fashionista',
                userAvatar: 'https://randomuser.me/api/portraits/women/1.jpg',
                likes: '12.5K',
                comments: '342',
                saves: '1.2K'
            },
            {
                id: 2,
                type: 'video',
                videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4',
                thumbnail: 'https://picsum.photos/id/26/400/500',
                title: '🍜 Easy 15-minute ramen recipe! 🍜 #cooking #ramen',
                username: 'foodie_diaries',
                userAvatar: 'https://randomuser.me/api/portraits/women/2.jpg',
                likes: '45.2K',
                comments: '1.2K',
                saves: '3.4K'
            },
            {
                id: 3,
                type: 'image',
                images: ['https://picsum.photos/id/15/400/500'],
                title: 'My cozy reading nook setup 📚✨ What should I read next?',
                username: 'booklover',
                userAvatar: 'https://randomuser.me/api/portraits/men/1.jpg',
                likes: '8.2K',
                comments: '156',
                saves: '892'
            },
            {
                id: 4,
                type: 'video',
                videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4',
                thumbnail: 'https://picsum.photos/id/29/400/500',
                title: '🏔️ Hiking in the Swiss Alps - unreal views! 🇨🇭',
                username: 'travel_adventures',
                userAvatar: 'https://randomuser.me/api/portraits/women/3.jpg',
                likes: '67.8K',
                comments: '2.3K',
                saves: '5.6K'
            },
            {
                id: 5,
                type: 'image',
                images: ['https://picsum.photos/id/22/400/500', 'https://picsum.photos/id/23/400/500', 'https://picsum.photos/id/24/400/500'],
                title: 'Skincare routine that changed my life ✨',
                username: 'glow_up',
                userAvatar: 'https://randomuser.me/api/portraits/women/4.jpg',
                likes: '34.1K',
                comments: '892',
                saves: '2.1K'
            },
            {
                id: 6,
                type: 'image',
                images: ['https://picsum.photos/id/27/400/500'],
                title: 'Minimalist home decor ideas 🏠',
                username: 'homeinspo',
                userAvatar: 'https://randomuser.me/api/portraits/men/2.jpg',
                likes: '15.3K',
                comments: '234',
                saves: '1.8K'
            }
        ];

        const videoPosts = posts.filter(p => p.type === 'video');

        function renderGrid() {
            const grid = document.getElementById('feedGrid');
            grid.innerHTML = posts.map(post => `
                <div class="post-card" data-post-id="${post.id}" data-post-type="${post.type}" data-video-url="${post.videoUrl || ''}">
                    <div class="image-container">
                        <img class="post-image" src="${post.type === 'video' ? post.thumbnail : post.images[0]}" alt="${post.title}">
                        ${post.type === 'video' ? `
                            <div class="video-badge">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="white" stroke="white">
                                    <polygon points="5 3 19 12 5 21 5 3"/>
                                </svg>
                                <span>Video</span>
                            </div>
                        ` : ''}
                        ${post.images && post.images.length > 1 ? `
                            <div class="multi-badge">
                                📷 ${post.images.length}
                            </div>
                        ` : ''}
                    </div>
                    <div class="post-info">
                        <div class="title">${post.title}</div>
                        <div class="user-row">
                            <img class="user-avatar" src="${post.userAvatar}" alt="">
                            <span class="username">${post.username}</span>
                        </div>
                        <div class="stats">
                            <span>❤️ ${post.likes}</span>
                            <span>💬 ${post.comments}</span>
                            <span>📌 ${post.saves}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('.post-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    const postType = card.dataset.postType;
                    const videoUrl = card.dataset.videoUrl;
                    
                    if (postType === 'video' && videoUrl) {
                        openVideoModal(videoUrl);
                    } else {
                        alert('📱 Tiksy - This would open the post details with comments and sharing!');
                    }
                });
            });
        }

        function openVideoModal(startVideoUrl) {
            const modal = document.getElementById('videoModal');
            const container = document.getElementById('videoScrollContainer');
            
            container.innerHTML = videoPosts.map((post, index) => `
                <div class="video-slide" data-video-index="${index}">
                    <video id="video-${index}" muted playsinline loop>
                        <source src="${post.videoUrl}" type="video/mp4">
                    </video>
                    <div class="video-overlay">
                        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
                            <img src="${post.userAvatar}" style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid white;">
                            <div>
                                <div style="font-weight: bold;">${post.username}</div>
                                <div style="font-size: 12px; opacity: 0.8;">${post.likes} likes</div>
                            </div>
                        </div>
                        <div style="font-size: 14px;">${post.title}</div>
                        <div style="display: flex; gap: 24px; margin-top: 16px;">
                            <span style="display: flex; align-items: center; gap: 6px; cursor: pointer;" onclick="likeInVideo(event, ${index})">❤️ ${post.likes}</span>
                            <span>💬 ${post.comments}</span>
                            <span>📌 ${post.saves}</span>
                        </div>
                    </div>
                </div>
            `).join('');
            
            modal.classList.add('active');
            
            setTimeout(() => {
                const videos = document.querySelectorAll('#videoScrollContainer video');
                videos.forEach((video, idx) => {
                    video.muted = true;
                    if (idx === 0) video.play().catch(e => console.log('autoplay:', e));
                });
                setupVideoScroll();
            }, 100);
        }

        let currentVideoIndex = 0;
        let currentVideo = null;

        function setupVideoScroll() {
            const container = document.getElementById('videoScrollContainer');
            const videos = document.querySelectorAll('#videoScrollContainer video');
            
            const checkVisible = () => {
                const slides = document.querySelectorAll('.video-slide');
                slides.forEach((slide, idx) => {
                    const rect = slide.getBoundingClientRect();
                    const isVisible = rect.top >= -100 && rect.top <= window.innerHeight / 2;
                    
                    if (isVisible && currentVideoIndex !== idx) {
                        if (currentVideo) currentVideo.pause();
                        currentVideo = videos[idx];
                        currentVideo.play().catch(e => console.log('play error:', e));
                        currentVideoIndex = idx;
                    }
                });
            };
            
            container.addEventListener('scroll', () => setTimeout(checkVisible, 100));
            container.addEventListener('scrollend', checkVisible);
            checkVisible();
        }

        function likeInVideo(event, videoIndex) {
            event.stopPropagation();
            const heart = document.createElement('div');
            heart.className = 'like-animation';
            heart.textContent = '❤️';
            heart.style.left = event.clientX + 'px';
            heart.style.top = event.clientY + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 600);
        }

        document.getElementById('closeModal').addEventListener('click', () => {
            const modal = document.getElementById('videoModal');
            const videos = document.querySelectorAll('#videoScrollContainer video');
            videos.forEach(v => v.pause());
            modal.classList.remove('active');
        });

        document.querySelectorAll('.category').forEach((cat, idx) => {
            cat.addEventListener('click', () => {
                document.querySelectorAll('.category').forEach(c => c.classList.remove('active'));
                cat.classList.add('active');
                alert(`📱 Tiksy - Showing ${cat.textContent} feed`);
            });
        });

        document.querySelectorAll('.nav-item').forEach((nav, idx) => {
            nav.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                nav.classList.add('active');
                alert(`📱 Tiksy - Navigated to ${nav.querySelector('.nav-label').textContent}`);
            });
        });

        document.getElementById('createBtn').addEventListener('click', () => {
            alert('📱 Tiksy - Create new post (Camera, Upload, Add music/filters)');
        });

        renderGrid();
        console.log('✅ Tiksy Loaded! TikTok + RedNote hybrid style');
    </script>
</body>
</html>
